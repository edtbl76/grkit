name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Everything runs in Docker as the runner's user: the same command a contributor runs locally.
      - run: bash scripts/test.sh
      # Send the test results (pytest + the rendered guard's bats) to Trunk Flaky Tests, pass or fail, so flaky tests
      # surface. The uploader is the maintainer's shared script, pinned to a commit and checked against its sha256; it
      # runs the pinned trunk-analytics-cli and fails the step if Trunk did not confirm the upload. Skipped for
      # Dependabot, whose runs get no secrets.
      - name: upload test results to Trunk
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_ORG_TOKEN }}
          TRUNK_COLLECTION_ID: ${{ vars.TRUNK_COLLECTION_ID }}
          TRUNK_REPO_URL: https://github.com/${{ github.repository }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_COMMIT_BRANCH: ${{ github.ref_name }}
          TRUNK_CLI_VERSION: 0.16.1
          TRUNK_CLI_SHA256: 8c34f99a41d4b3151f711aca05d01478b2f707dd698d3980d2524646021af5f2
          UPLOADER_COMMIT: 45c0b1caaf8b53a4647a0fb18dade66b5cdaaf2b
          UPLOADER_SHA256: 09f3887d98e403800cc7a249eb2979b18405dd096a9d823cb8b066d8f8e6dd55
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/trunk-cli.tgz \
            "https://github.com/trunk-io/analytics-cli/releases/download/$TRUNK_CLI_VERSION/trunk-analytics-cli-x86_64-unknown-linux.tar.gz"
          echo "$TRUNK_CLI_SHA256  /tmp/trunk-cli.tgz" | sha256sum -c -
          mkdir -p /tmp/trunk && tar -xzf /tmp/trunk-cli.tgz -C /tmp/trunk trunk-analytics-cli
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/trunk-upload.sh \
            "https://raw.githubusercontent.com/edtbl76/weyland-lab/$UPLOADER_COMMIT/scripts/ci/trunk-upload.sh"
          echo "$UPLOADER_SHA256  /tmp/trunk-upload.sh" | sha256sum -c -
          TRUNK_CLI=/tmp/trunk/trunk-analytics-cli bash /tmp/trunk-upload.sh reports/junit
      - name: shellcheck
        run: docker run --rm -v "$PWD":/mnt:ro koalaman/shellcheck:stable --severity=warning /mnt/scripts/test.sh /mnt/template/scripts/check-required-docs.sh
