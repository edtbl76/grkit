[build-system]
requires = ["setuptools>=77"]   # 77+: the SPDX `license = "MIT"` string
build-backend = "setuptools.build_meta"

[project]
name = "grkit"
version = "0.2.0"
description = "Guardrails kit: fail-open runtime LLM guard contracts + fail-closed build-time checks"
readme = "README.md"   # inside python/: setuptools refuses files outside the package dir
requires-python = ">=3.10"
license = "MIT"
dependencies = []          # stdlib only, on purpose: model-backed validators live in the services that need them

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
